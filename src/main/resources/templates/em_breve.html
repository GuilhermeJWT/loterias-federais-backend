<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Breve - Loterias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --lotofacil-primary: #6A0DAD;
            --lotofacil-secondary: #9B59B6;
            --megasena-primary: #00A859;
            --megasena-secondary: #00FF88;
            --lotomania-primary: #FF6B00;
            --lotomania-secondary: #FFB84D;
            --quina-primary: #1E90FF;
            --quina-secondary: #87CEEB;
            --gold: #FFD700;
            --dark-bg: #1a1a2e;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255,215,0,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(102,126,234,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .coming-soon-card {
            background: white;
            border-radius: 30px;
            padding: 4rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .coming-soon-icon {
            font-size: 6rem;
            color: var(--gold);
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .coming-soon-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #333;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--lotofacil-primary), var(--megasena-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .coming-soon-text {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            font-weight: 300;
            line-height: 1.8;
        }

        .btn-back {
            background: linear-gradient(135deg, var(--lotofacil-primary) 0%, var(--lotofacil-secondary) 100%);
            border: none;
            color: white;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.3);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(106, 13, 173, 0.4);
            color: white;
        }

        .lucky-symbols {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .lucky-symbol {
            font-size: 2rem;
            color: var(--gold);
            animation: float 3s ease-in-out infinite;
        }

        .lucky-symbol:nth-child(2) {
            animation-delay: 0.5s;
        }

        .lucky-symbol:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.2;
            animation: particleFloat 20s infinite;
        }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.2;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="coming-soon-card">
        <div class="lucky-symbols">
            <i class="fas fa-clover lucky-symbol"></i>
            <i class="fas fa-star lucky-symbol"></i>
            <i class="fas fa-crown lucky-symbol"></i>
        </div>

        <div class="coming-soon-icon">
            <i class="fas fa-clock"></i>
        </div>
        <h1 class="coming-soon-title">Em Breve!</h1>
        <p class="coming-soon-text">
            Este jogo ainda está em desenvolvimento. <br>
            Em breve você poderá fazer análises e gerar jogos aqui!
        </p>
        <a href="/" class="btn btn-back">
            <i class="fas fa-arrow-left me-2"></i>Voltar para Início
        </a>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
